<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri App</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div class="titlebar-container">
      <div class="titlebar"></div>
      <div class="titlebar-controls">
        <button id="titlebar-minimize" class="titlebar-button">_</button>
        <button id="titlebar-close" class="titlebar-button">✕</button>
      </div>
    </div>
    <main class="container" data-tauri-drag-region>
      <h1 data-tauri-drag-region>Welcome to Tauri</h1>

      <div class="row" data-tauri-drag-region>
        <a href="https://vite.dev" target="_blank">
          <img src="/src/assets/vite.svg" class="logo vite" alt="Vite logo" />
        </a>
        <a href="https://tauri.app" target="_blank">
          <img
            src="/src/assets/tauri.svg"
            class="logo tauri"
            alt="Tauri logo"
          />
        </a>
        <a href="https://www.typescriptlang.org/docs" target="_blank">
          <img
            src="/src/assets/typescript.svg"
            class="logo typescript"
            alt="typescript logo"
          />
        </a>
      </div>
      <p data-tauri-drag-region>
        Click on the Tauri logo to learn more about the framework
      </p>

      <form class="row" id="greet-form">
        <input id="greet-input" placeholder="Enter a name..." />
        <button type="submit">Greet</button>
      </form>
      <p id="greet-msg"></p>
    </main>
  </body>
</html>
